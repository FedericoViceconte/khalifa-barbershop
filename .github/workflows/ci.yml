# Pruebas del frontend, del backend contra MySQL real y de la imagen de Docker en cada cambio.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas
        run: npm test
      - name: Compilar
        run: npm run build

  backend:
    name: Backend y MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: raiz-de-ci
          MYSQL_DATABASE: khalifa_pruebas
          MYSQL_USER: khalifa
          MYSQL_PASSWORD: clave-de-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -praiz-de-ci --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: khalifa
      MYSQL_PASSWORD: clave-de-ci
      MYSQL_TEST_DB: khalifa_pruebas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas unitarias y de integración
        run: npm test

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Crear el .env
        run: |
          {
            echo "MYSQL_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_USER=admin"
            echo "ADMIN_PASSWORD=ci-$(openssl rand -hex 12)"
          } > .env
      - name: Construir y levantar la app y la base
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Probar el sitio, la API y el panel
        run: |
          curl -fsS http://127.0.0.1:3000/api/salud
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:3000/admin/login | grep -q 'name="csrfToken"'
          dia=$(TZ=America/Argentina/Buenos_Aires date -d '+7 days' +%F)
          curl -fsS "http://127.0.0.1:3000/api/turnos/disponibilidad?fecha=${dia}&servicio=corte" | tee /dev/stderr | grep -q '"horarios"'
          docker compose logs app | grep -q 'Administrador inicial creado: admin'
      - name: Registros
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v
